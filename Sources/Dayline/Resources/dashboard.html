<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dayline</title>
<link rel="stylesheet" href="dashboard.css">
</head>
<body>

<header class="bar">
  <div class="row gap">
    <button id="prevDay" class="btn icon" title="Previous day">&#8249;</button>
    <div class="cal-anchor">
      <button id="dayLabel" class="btn day-label qa-day-label" title="Pick a date">--</button>
      <div id="cal" class="cal qa-cal" hidden>
        <div class="row between">
          <button id="calPrev" class="btn icon qa-cal-prev" title="Previous month">&#8249;</button>
          <span id="calMonth" class="cal-title qa-cal-month"></span>
          <button id="calNext" class="btn icon qa-cal-next" title="Next month">&#8250;</button>
        </div>
        <div id="calGrid" class="cal-grid"></div>
        <div class="row between hint">
          <span class="row gap"><i class="cal-key heat-0"></i>No data</span>
          <span class="row gap">
            <span class="row">
              <i class="cal-key heat-1" title="Under 3h"></i>
              <i class="cal-key heat-2" title="3 to 6h"></i>
              <i class="cal-key heat-3" title="6 to 9h"></i>
              <i class="cal-key heat-4" title="9 to 12h"></i>
              <i class="cal-key heat-5" title="12h or more"></i>
            </span>
            0 to 12h+
          </span>
        </div>
      </div>
    </div>
    <button id="nextDay" class="btn icon" title="Next day">&#8250;</button>
    <button id="todayBtn" class="btn">Today</button>
  </div>
  <div class="row gap">
    <div class="seg" id="groupSel">
      <button class="btn seg-btn is-on" data-g="day">Day</button>
      <button class="btn seg-btn" data-g="hour">Hour</button>
    </div>
    <div class="seg" id="zoomSel" hidden>
      <button id="zoomOut" class="btn icon" title="Zoom out">&#8722;</button>
      <button id="zoomIn" class="btn icon" title="Zoom in">&#43;</button>
    </div>
    <div class="seg" id="tabs">
      <button class="btn seg-btn" data-tab="list">List</button>
      <button class="btn seg-btn is-on" data-tab="timeline">Timeline</button>
      <button class="btn seg-btn" data-tab="rules">Rules</button>
    </div>
  </div>
</header>

<main>
  <section id="view-list" hidden>
    <div class="pane">
      <h2>Activity log
        <span class="hint">newest first &#183; start times resolve to 1 minute</span></h2>
      <div id="listTable"></div>
    </div>
  </section>

  <section id="view-timeline">
    <div class="tl-scroll" id="tlScroll">
      <div class="tl-inner" id="tlInner">
        <canvas id="strip" class="strip"></canvas>
        <div id="cursor" class="cursor" hidden></div>
        <div id="axis" class="axis"></div>
      </div>
    </div>

    <div id="tlEmpty" class="empty" hidden>No activity recorded for this day.</div>
    <nav id="crumb" class="crumb" hidden></nav>

    <div class="split">
      <div class="pane">
        <h2>Categories</h2>
        <div id="totals" class="totals"></div>
      </div>
      <div class="pane">
        <h2>Activities</h2>
        <div id="labels" class="tablewrap"></div>
      </div>
    </div>
  </section>

  <section id="view-rules" hidden>
    <div class="pane">
      <div class="row between">
        <h2>Rules <span class="hint">first match wins</span></h2>
        <div class="row gap">
          <button id="addRule" class="btn">Add rule</button>
          <button id="saveRules" class="btn primary">Save</button>
          <span id="saveMsg" class="hint"></span>
        </div>
      </div>
      <div id="rulesTable" class="tablewrap"></div>
    </div>

    <div class="pane">
      <div class="row between">
        <h2>Categories</h2>
        <button id="addCat" class="btn">Add category</button>
      </div>
      <div id="catsTable" class="tablewrap"></div>
    </div>

    <div class="pane">
      <h2>Raw observations <span class="hint">exactly as recorded &#183; click + to seed a rule</span></h2>
      <div id="rawTable" class="tablewrap"></div>
    </div>
  </section>
</main>

<footer class="bar foot">
  <span id="status" class="hint">&#8230;</span>
  <span class="hint" id="lastSeen"></span>
</footer>

<div id="tip" class="tip" hidden></div>
<script src="calendar.js"></script>
<script src="dashboard.js"></script>
</body>
</html>
